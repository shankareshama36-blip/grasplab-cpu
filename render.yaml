services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + CPU Simulation Engine)
  # -------------------------------------------------------------
  - type: web
    name: grasplab-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: grasplab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://grasplab-web.onrender.com,http://localhost:5173

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite + Pure CSS)
  # -------------------------------------------------------------
  - type: web
    name: grasplab-web
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://grasplab-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: grasplab-db
    region: oregon
    plan: free
    databaseName: grasplab
    user: grasplab_user
