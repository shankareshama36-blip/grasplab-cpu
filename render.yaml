databases:
  - name: grasplab-db
    databaseName: grasplab
    user: grasplab_user
    plan: free

services:
  - type: web
    name: grasplab-app
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grasplab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
